<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ewigo · Candidature</title>
    <script>(function(){var link=document.createElement("link");link.rel="stylesheet";link.href="../../assets/css/styles.css?v="+Date.now();document.head.appendChild(link);}())</script>
  </head>
  <body class="ewigo-theme career-minimal">
    <div class="career-site ewigo-theme career-minimal">
      <header class="career-site-header">
        <div class="brand">
          <img
            class="logo-img"
            src="assets/images/image_commerical.jpeg"
            alt="Logo Ewigo"
          />
          <div>
            <div class="title">EWIGO</div>
            <div class="subtitle">Candidature</div>
          </div>
        </div>
        <nav class="career-site-nav">
          <a href="index.html">Carrières</a>
          <a href="index.html#jobs">Nos offres</a>
          <a href="index.html#locations">Agences</a>
          <a href="values.html">Culture</a>
          <a href="index.html#contact">Contact</a>
        </nav>
      </header>

      <main class="career-site-content">
        <div class="cta-box">
          <div class="card-header">
            <h2>Candidature simplifiée</h2>
            <span class="badge">2 minutes</span>
          </div>
          <p>
            Importez votre CV, laissez vos coordonnées et un message pour le recruteur.
          </p>
        </div>

        <form class="apply-form">
          <div class="form-grid">
            <label class="form-field">
              Prénom
              <input type="text" placeholder="Sofia" />
            </label>
            <label class="form-field">
              Nom
              <input type="text" placeholder="Martin" />
            </label>
            <label class="form-field">
              Email
              <input type="email" placeholder="sofia@email.com" />
            </label>
            <label class="form-field">
              Téléphone
              <input type="tel" placeholder="+33 6 12 34 56 78" />
            </label>
          </div>
          <label class="form-field">
            Message au recruteur
            <textarea placeholder="Présentez-vous en quelques lignes..."></textarea>
          </label>
          <label class="form-field">
            CV
            <div class="file-input">
              <input type="file" />
              <div class="muted">Formats acceptés: PDF, DOCX</div>
            </div>
          </label>
          <div class="form-actions">
            <a class="primary button-link" href="index.html#jobs">Envoyer ma candidature</a>
            <a class="ghost button-link" href="index.html#jobs">Retour aux offres</a>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
